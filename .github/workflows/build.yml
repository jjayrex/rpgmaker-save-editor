name: Build

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless, except for
# tags, whose runs publish a release and must be left alone.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Trunk builds the WebAssembly front end. Bump this when you bump it locally.
  TRUNK_VERSION: v0.21.14

jobs:
  test:
    name: Tests and lints
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Ruby is present on GitHub's runners, so the tests that hand our output
      # to a real Ruby for checking will run rather than skip.
      - run: cargo test --workspace

      - name: Install Trunk
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      - name: Build the interface
        run: trunk build

      # A `>` in an unbraced attribute value ends the tag early in the `view!`
      # macro: the rest of the element becomes a text node, so a button turns
      # into its own source code and stops working. It compiles without a
      # murmur, but the leaked markup is a string in the bundle.
      - name: Check the markup compiled rather than leaking as text
        shell: bash
        run: |
          leaked=$(grep -aoE 'on:(click|change|input|submit)=.{0,60}' dist/*.wasm || true)
          if [ -n "$leaked" ]; then
            echo "::error::Markup leaked into the interface as text: $leaked"
            echo "Put the comparison in a memo, or brace the attribute value."
            exit 1
          fi

  bundle:
    name: ${{ matrix.name }} installers
    needs: test
    # Pull requests get the tests; building installers for them is wasted time.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 is the oldest supported image, and the resulting binaries need
          # only the glibc that ships with it — build on a newer one and older
          # distributions can no longer run the result.
          # No AppImage: it bundles this runner's WebKitGTK, and an older
          # WebKit cannot initialise EGL against a newer host's drivers —
          # the window comes up grey. The portable tarball below uses the
          # host's own WebKit instead, which works everywhere it is installed.
          - os: ubuntu-22.04
            name: Linux x86_64
            platform: linux
            arch: x86_64
            bundles: deb
            trunk_asset: trunk-x86_64-unknown-linux-gnu.tar.gz
          # Built natively on GitHub's Arm runner rather than cross-compiled:
          # cross-compiling would need an arm64 sysroot of WebKitGTK and all
          # its dependencies, where the native runner just installs them with
          # apt. 22.04 for the same glibc reason as above.
          - os: ubuntu-22.04-arm
            name: Linux AArch64
            platform: linux
            arch: aarch64
            bundles: deb
            trunk_asset: trunk-aarch64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            name: Windows x86_64
            platform: win
            arch: x86_64
            bundles: nsis,msi
            trunk_asset: trunk-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-bundle

      - name: Install Trunk
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/${{ matrix.trunk_asset }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL "$url" -o trunk.zip
            unzip -o trunk.zip -d "$HOME/.cargo/bin"
          else
            curl -fsSL "$url" | tar -xz -C "$HOME/.cargo/bin"
          fi
          trunk --version

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          # The bundler names its output after the product and version, which
          # differs per bundle and per platform. Everything is renamed and
          # uploaded below instead, so that every download — whether from a
          # release or from a run's artifacts — follows one pattern:
          # rpgmaker-save-editor-<platform>-<arch>[-setup].<ext>
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false

      - name: Name the builds
        shell: bash
        env:
          BASE: rpgmaker-save-editor-${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p assets

          # Takes the one file a pattern matches. Finding none or several means
          # the bundler changed its output, and stopping here is better than a
          # release that is quietly missing a download.
          take() {
            dest=$1
            shift
            if [ "$#" -ne 1 ]; then
              echo "::error::expected one file for $dest, found $#: $*"
              exit 1
            fi
            cp "$1" "assets/$dest"
          }

          if [ "$RUNNER_OS" = "Windows" ]; then
            # The executable on its own: everything the app needs is compiled
            # into it, apart from the system webview (WebView2 here, WebKitGTK
            # on Linux). No installer, nothing written outside its own folder.
            take "$BASE.exe" target/release/rpgmaker-save-editor.exe
            take "$BASE-setup.exe" target/release/bundle/nsis/*-setup.exe
            take "$BASE-setup.msi" target/release/bundle/msi/*.msi
          else
            # A tarball, because a bare file downloaded from a release loses
            # its executable bit.
            tar -czf "assets/$BASE.tar.gz" -C target/release rpgmaker-save-editor
            take "$BASE.deb" target/release/bundle/deb/*.deb
          fi
          ls -l assets/

      - uses: actions/upload-artifact@v7
        with:
          name: rpgmaker-save-editor-${{ matrix.platform }}-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error

  # Pushing a tag such as 1.2.3 drafts a release with every build attached;
  # review it on the Releases page, then publish. Nothing is attached until all
  # of the jobs above have succeeded, so a release is never half built.
  release:
    name: Draft the release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Attach the builds to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One folder per job on the way in, and the names inside them are
          # already the ones the release should carry.
          mkdir -p assets
          find artifacts -type f -exec cp {} assets/ \;
          ls -l assets/
          if [ -z "$(ls -A assets)" ]; then
            echo "::error::the build jobs produced nothing to release"
            exit 1
          fi

          cat > notes.md <<'EOF'
          Editor for RPG Maker 2000, 2003, XP, VX, VX Ace, MV and MZ save files.

          - **Windows**: `-setup.exe` to install, `-setup.msi` for the same through Windows Installer, or the plain `.exe` to run from wherever you put it.
          - **Linux**: `.deb` for Debian and Ubuntu, or the portable `.tar.gz` for other distributions, which uses the system's own WebKitGTK 4.1.
          EOF

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a tag replaces the files it uploaded last time.
            gh release upload "$GITHUB_REF_NAME" assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --repo "$GITHUB_REPOSITORY" --draft \
              --title "RPG Maker Save Editor $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
