[package]
name = "rpgmaker-save-editor-ui"
version = "0.3.0"
edition = "2024"
description = "Front end for the RPG Maker Save Editor"
license.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
serde_json = "1"
rpgsave-protocol = { path = "crates/protocol" }

[workspace]
members = ["src-tauri", "crates/rpgsave"]

# The licence text is in LICENSE at the repository root. This is the "-only"
# identifier because the project does not elect the AGPL's "or any later
# version" option.
[workspace.package]
license = "AGPL-3.0-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
