[package]
name = "rpgmaker-save-editor-ui"
version = "0.2.1"
edition = "2024"
description = "Front end for the RPG Maker Save Editor"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
serde_json = "1"
rpgsave-protocol = { path = "crates/protocol" }

[workspace]
members = ["src-tauri", "crates/rpgsave"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
